<text x="380" y="252" font-size="15" font-weight="700" text-anchor="middle" fill="#14213d">Connectors</text>
<text x="380" y="276" font-size="13" text-anchor="middle" fill="#5b6b85">ask each tool's</text>
<text x="380" y="294" font-size="13" text-anchor="middle" fill="#5b6b85">official API for</text>
<text x="380" y="312" font-size="13" text-anchor="middle" fill="#5b6b85">new &amp; changed</text>
<text x="380" y="330" font-size="13" text-anchor="middle" fill="#5b6b85">messages</text>
<path d="M460 275 L522 275" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arr)"/>
<!-- map -->
<rect x="526" y="90" width="238" height="370" rx="16" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
<text x="645" y="124" font-size="15" font-weight="700" text-anchor="middle" fill="#14213d">🧭 Every item becomes</text>
