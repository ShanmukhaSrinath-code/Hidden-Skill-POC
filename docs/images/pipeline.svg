<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 588" width="1248" height="588" role="img" aria-label="Pipeline: connect, collect, map, store, show" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>Pipeline: connect, collect, map, store, show</title>
<rect x="1" y="1" width="1246" height="586" rx="20" fill="#ffffff" stroke="#dfe6f0" stroke-width="2"/>
<g transform="translate(24,24)">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker>
  <linearGradient id="db" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eaf1ff"/><stop offset="1" stop-color="#d9e6ff"/></linearGradient>
</defs>
<!-- stage labels -->
<g font-size="13" font-weight="700" fill="#5b6b85" letter-spacing="1.5">
