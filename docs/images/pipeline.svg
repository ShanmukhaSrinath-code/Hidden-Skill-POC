  <rect x="546" y="140" width="198" height="34" rx="8" fill="#e2f5f1"/><text x="560" y="162" fill="#0f9d8f" font-weight="700">👤 Sender</text>
  <rect x="546" y="180" width="198" height="34" rx="8" fill="#eef3fd"/><text x="560" y="202" fill="#2f6fed" font-weight="700">👥 Recipients</text>
  <rect x="546" y="220" width="198" height="34" rx="8" fill="#fcf0dc"/><text x="560" y="242" fill="#b7791f" font-weight="700">@ Mentions</text>
