  <rect x="546" y="300" width="198" height="34" rx="8" fill="#f3f5f9"/><text x="560" y="322" fill="#14213d">🕒 When</text>
  <rect x="546" y="340" width="198" height="34" rx="8" fill="#f3f5f9"/><text x="560" y="362" fill="#14213d">📝 Text</text>
  <rect x="546" y="380" width="198" height="34" rx="8" fill="#f3f5f9"/><text x="560" y="402" fill="#14213d">🔗 Link to original</text>
</g>
<path d="M764 275 L822 275" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arr)"/>
<!-- database cylinder -->
<path d="M826 150 v250 a69 22 0 0 0 138 0 v-250" fill="url(#db)" stroke="#9fbaf6" stroke-width="1.5"/>
<ellipse cx="895" cy="150" rx="69" ry="22" fill="#f4f8ff" stroke="#9fbaf6" stroke-width="1.5"/>
<text x="895" y="214" font-size="30" text-anchor="middle">🗄️</text>
<text x="895" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#14213d">PostgreSQL</text>
<text x="895" y="272" font-size="12" text-anchor="middle" fill="#5b6b85">one database</text>
<text x="895" y="298" font-size="12" text-anchor="middle" fill="#5b6b85">same format for</text>
<text x="895" y="314" font-size="12" text-anchor="middle" fill="#5b6b85">every tool</text>


<path d="M964 275 L1022 275" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arr)"/>
