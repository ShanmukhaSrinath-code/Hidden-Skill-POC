  <text x="645" y="22" text-anchor="middle">3 · MAP</text><text x="895" y="22" text-anchor="middle">4 · STORE</text><text x="1110" y="22" text-anchor="middle">5 · SHOW</text>
</g>
<!-- sources -->
<g>
  <rect x="20" y="40" width="200" height="110" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="36" y="72" font-size="19" font-weight="700" fill="#14213d">💬 Slack</text>
  <text x="36" y="100" font-size="13" fill="#5b6b85">🔑 bot key + 5 personal keys</text><text x="36" y="124" font-size="13" fill="#0f9d8f">⚡ instant</text>

  <rect x="20" y="165" width="200" height="110" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="36" y="197" font-size="19" font-weight="700" fill="#14213d">🎫 Jira</text>
  <text x="36" y="225" font-size="13" fill="#5b6b85">🛡️ 1 admin key</text><text x="36" y="249" font-size="13" fill="#5b6b85">⏱ every minute</text>

  <rect x="20" y="290" width="200" height="110" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="36" y="322" font-size="19" font-weight="700" fill="#14213d">📘 Confluence</text>
  <text x="36" y="350" font-size="13" fill="#5b6b85">🛡️ same admin key</text><text x="36" y="374" font-size="13" fill="#5b6b85">⏱ every minute</text>

  <rect x="20" y="415" width="200" height="110" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="36" y="447" font-size="19" font-weight="700" fill="#14213d">✅ ClickUp</text>
  <text x="36" y="475" font-size="13" fill="#5b6b85">🔑 5 personal keys</text><text x="36" y="499" font-size="13" fill="#5b6b85">⏱ every minute</text>
</g>
<!-- arrows sources -> collect -->
<g stroke="#2f6fed" stroke-width="2" fill="none" marker-end="url(#arr)">
  <path d="M220 95 C255 95 260 230 296 260"/><path d="M220 220 C255 220 262 255 296 270"/>
  <path d="M220 345 C255 345 262 290 296 282"/><path d="M220 470 C255 470 260 310 296 292"/>
</g>
