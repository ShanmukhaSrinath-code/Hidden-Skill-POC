<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Agents 1-4 applied to one real thread" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>Agents 1-4 applied to one real thread</title>
<rect x="1" y="1" width="1198" height="468" rx="20" fill="#ffffff" stroke="#dfe6f0" stroke-width="2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker></defs><text x="40" y="44" font-size="13" font-weight="800" fill="#5b6b85" letter-spacing="1.4">ONE REAL THREAD THROUGH AGENTS 1–4</text><rect x="30" y="64" width="330" height="236" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="46" y="92" font-size="15" font-weight="700" fill="#14213d">✅ ClickUp · DM Pradeep ↔ Ramu</text><circle cx="58" cy="126" r="14" fill="#b7791f"/><text x="58" y="131" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P</text><rect x="80" y="108" width="266" height="48" rx="10" fill="#f3f5f9"/><text x="92" y="129" font-size="12" fill="#14213d">Semantic search got slow after</text><text x="92" y="147" font-size="12" fill="#14213d">500k documents. What should I check?</text><circle cx="58" cy="188" r="14" fill="#0f9d8f"/><text x="58" y="193" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">R</text><rect x="80" y="170" width="266" height="48" rx="10" fill="#e2f5f1"/><text x="92" y="191" font-size="12" fill="#14213d">Add an HNSW index, run ANALYZE,</text><text x="92" y="209" font-size="12" fill="#14213d">cap ef_search at 64 → ~20ms.</text><circle cx="58" cy="250" r="14" fill="#b7791f"/><text x="58" y="255" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P</text><rect x="80" y="232" width="266" height="34" rx="10" fill="#f3f5f9"/><text x="92" y="253" font-size="12" fill="#14213d">That fixed it, 25ms now. Thanks!</text><rect x="400" y="64" width="180" height="66" rx="14" fill="#fff8ec" stroke="#f1dfb6" stroke-width="1.6"/><text x="416" y="92" font-size="14.5" font-weight="700" fill="#14213d">1 · Filter</text><text x="416" y="114" font-size="11.5" fill="#b7791f" font-weight="700" font-family="Consolas, Menlo, monospace">qwen2.5:3b</text><path d="M490 132 L490 152" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="400" y="156" width="180" height="144" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="490" y="188" font-size="15" font-weight="800" fill="#0f9d8f" text-anchor="middle">KEEP</text><text x="414" y="220" font-size="12" fill="#5b6b85">signal: helpful answer</text><text x="414" y="242" font-size="12" fill="#5b6b85">noise (greetings, memes,</text><text x="414" y="264" font-size="12" fill="#5b6b85">status chatter) is dropped</text><path d="M580 97 L592 97" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="596" y="64" width="180" height="66" rx="14" fill="#fff8ec" stroke="#f1dfb6" stroke-width="1.6"/><text x="612" y="92" font-size="14.5" font-weight="700" fill="#14213d">2 · Who &amp; what</text><text x="612" y="114" font-size="11.5" fill="#b7791f" font-weight="700" font-family="Consolas, Menlo, monospace">qwen2.5:7b</text><path d="M686 132 L686 152" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="596" y="156" width="180" height="144" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="686" y="188" font-size="15" font-weight="800" fill="#14213d" text-anchor="middle">Ramu → Pradeep</text><text x="610" y="220" font-size="12" fill="#5b6b85">skill: Vector Databases</text><text x="610" y="242" font-size="12" fill="#5b6b85">topic: slow semantic search</text><text x="610" y="264" font-size="12" fill="#5b6b85">people as EMP_IDs</text><path d="M776 97 L788 97" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="792" y="64" width="180" height="66" rx="14" fill="#fff8ec" stroke="#f1dfb6" stroke-width="1.6"/><text x="808" y="92" font-size="14.5" font-weight="700" fill="#14213d">3 · Validate</text><text x="808" y="114" font-size="11.5" fill="#b7791f" font-weight="700" font-family="Consolas, Menlo, monospace">rules first</text><path d="M882 132 L882 152" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="792" y="156" width="180" height="144" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="882" y="188" font-size="15" font-weight="800" fill="#0f9d8f" text-anchor="middle">CONFIRMED 10/10</text><text x="806" y="220" font-size="12" fill="#5b6b85">“That fixed it, 25ms now”</text><text x="806" y="242" font-size="12" fill="#5b6b85">from someone else = proof</text><text x="806" y="264" font-size="12" fill="#5b6b85">no proof? judged 1–10</text><path d="M972 97 L984 97" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="988" y="64" width="180" height="66" rx="14" fill="#fff8ec" stroke="#f1dfb6" stroke-width="1.6"/><text x="1004" y="92" font-size="14.5" font-weight="700" fill="#14213d">4 · Graph write</text><text x="1004" y="114" font-size="11.5" fill="#b7791f" font-weight="700" font-family="Consolas, Menlo, monospace">code</text><path d="M1078 132 L1078 152" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="988" y="156" width="180" height="144" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="1078" y="188" font-size="15" font-weight="800" fill="#b7791f" text-anchor="middle">DISCOVERED</text><text x="1002" y="220" font-size="12" fill="#5b6b85">Ramu · Vector Databases</text><text x="1002" y="242" font-size="12" fill="#5b6b85">not in his Frontend role</text><text x="1002" y="264" font-size="12" fill="#5b6b85">ev_… → message link</text><path d="M360 97 L396 97" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><text x="40" y="344" font-size="13" font-weight="800" fill="#5b6b85" letter-spacing="1.4">AGENT 3 DECISION RULES</text><rect x="30" y="360" width="276" height="86" rx="12" fill="#e2f5f1"/><text x="44" y="388" font-size="14" font-weight="700" fill="#0f9d8f">✅ Confirmed by someone else</text><text x="44" y="410" font-size="12" fill="#5b6b85">“thanks, it worked” → evidence,</text><text x="44" y="428" font-size="12" fill="#5b6b85">scored 10/10</text><rect x="318" y="360" width="276" height="86" rx="12" fill="#eef3fd"/><text x="332" y="388" font-size="14" font-weight="700" fill="#2f6fed">🎫 Ticket / task moved to Done</text><text x="332" y="410" font-size="12" fill="#5b6b85">backs the outcome; the answer is</text><text x="332" y="428" font-size="12" fill="#5b6b85">still judged, kept if ≥ 7</text><rect x="606" y="360" width="276" height="86" rx="12" fill="#fcf0dc"/><text x="620" y="388" font-size="14" font-weight="700" fill="#b7791f">🤔 No signal at all</text><text x="620" y="410" font-size="12" fill="#5b6b85">local model judges correctness</text><text x="620" y="428" font-size="12" fill="#5b6b85">1–10, kept if ≥ 7</text><rect x="894" y="360" width="276" height="86" rx="12" fill="#fdf1f2"/><text x="908" y="388" font-size="14" font-weight="700" fill="#b4434b">🚫 Not help</text><text x="908" y="410" font-size="12" fill="#5b6b85">questions, promises, assignments,</text><text x="908" y="428" font-size="12" fill="#5b6b85">own status reports</text>
</svg>
