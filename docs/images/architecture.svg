="#fff" stroke="#7b68ee" stroke-width="1.5"/><text x="195" y="145" font-size="11.5" font-weight="700" fill="#14213d" text-anchor="middle">✅ ClickUp</text><text x="54" y="178" font-size="11" fill="#5b6b85">next: Outlook · Teams · Gong</text><rect x="300" y="52" width="220" height="140" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="316" y="80" font-size="15" font-weight="700" fill="#14213d">🔌 Connectors</text><text x="316" y="104" font-size="12.5" fill="#5b6b85">ingest.py (Socket Mode)</text><text x="316" y="123" font-size="12.5" fill="#5b6b85">jira · confluence · clickup.py</text><text x="316" y="142" font-size="12.5" fill="#5b6b85">every key = what its owner sees</text><text x="316" y="161" font-size="12.5" fill="#5b6b85">instant / every 60 s</text><rect x="570" y="52" width="250" height="140" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="586" y="80" font-size="15" font-weight="700" fill="#14213d">🗄️ Raw tables</text><text x="586" y="104" font-size="12.5" fill="#5b6b85">slack_* (Slack)</text><text x="586" y="123" font-size="12.5" fill="#5b6b85">unified_* (Jira · Confluence · ClickUp)</text><text x="586" y="142" font-size="12.5" fill="#5b6b85">sender · recipients · @mentions</text><text x="586" y="161" font-size="12.5" fill="#5b6b85">upserted · source links</text><rect x="870" y="52" width="290" height="140" rx="14" fill="#14213d" stroke="#14213d" stroke-width="1.6"/><text x="886" y="80" font-size="15" font-weight="700" fill="#fff">📊 Live dashboard  /</text><text x="886" y="104" font-size="12.5" fill="#9fb8e6">live stream of every message</text><text x="886" y="123" font-size="12.5" fill="#9fb8e6">Person + Platform filters</text><text x="886" y="142" font-size="12.5" fill="#9fb8e6">illustrated /how-it-works</text><path d="M250 122 L296 122" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M520 122 L566 122" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M820 122 L866 122" stroke="#2f6fed" stroke-width="2.2" fill="none" marker-end="url(#a)"/><rect x="40" y="262" width="210" height="140" rx="14" fill="#fff" stroke="#dfe6f0" stroke-width="1.6"/><text x="56" y="290" font-size="15" font-weight="700" fill="#14213d">👥 HRMS file</text><text x="56" y="314" font-size="12.5" fill="#5b6b85">EMP_ID · role · department</text><text x="56" y="333" font-size="12.5" fill="#5b6b85">declared + resume skills</text><text x="56" y="352" font-size="12.5" fill="#5b6b85">data/hrms_employees.csv</text><rect x="300" y="262" width="220" height="140" rx="14" fill="#fff" stroke="#9fbaf6" stroke-width="1.6"/><text x="316" y="290" font-size="15" font-weight="700" fill="#14213d">🪪 Identity resolution</text><text x="316" y="314" font-size="12.5" fill="#5b6b85">every account → EMP_ID</text><text x="316" y="333" font-size="12.5" fill="#5b6b85">matched by email</text><text x="316" y="352" font-size="12.5" fill="#5b6b85">manual overrides · no LLM</text><rect x="570" y="262" width="250" height="140" rx="14" fill="#fff" stroke="#9fbaf6" stroke-width="1.6"/><text x="586" y="290" font-size="15" font-weight="700" fill="#14213d">🧾 activity_records</text><text x="586" y="314" font-size="12.5" fill="#5b6b85">who · did what · where · when</text><text x="586" y="333" font-size="12.5" fill="#5b6b85">+ business context + link</text><text x="586" y="352" font-size="12.5" fill="#5b6b85">all sources · people as EMP_IDs</text><text x="586" y="371" font-size="12.5" fill="#5b6b85">bots &amp; join notices removed</text><rect x="870" y="262" width="290" height="140" rx="14" fill="#fff" stroke="#9fbaf6" stroke-width="1.6"/><text x="886" y="290" font-size="15" font-weight="700" fill="#14213d">🧵 activity_threads</text><text x="886" y="314" font-size="12.5" fill="#5b6b85">one help exchange = one thread</text><text x="886" y="333" font-size="12.5" fill="#5b6b85">readable transcript</text><text x="886" y="352" font-size="12.5" fill="#5b6b85">evidence links</text><text x="886" y="371" font-si