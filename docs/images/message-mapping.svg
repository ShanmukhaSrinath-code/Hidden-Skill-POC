<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 412" width="1248" height="412" role="img" aria-label="One message mapped into a record" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>One message mapped into a record</title>
<rect x="1" y="1" width="1246" height="410" rx="20" fill="#ffffff" stroke="#dfe6f0" stroke-width="2"/>
<g transform="translate(24,24)">
<defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker></defs>
<!-- chat window -->
<rect x="20" y="20" width="440" height="290" rx="16" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
<rect x="20" y="20" width="440" height="44" rx="16" fill="#f3f5f9"/><rect x="20" y="48" width="440" height="16" fill="#f3f5f9"/>
<text x="40" y="48" font-size="14" font-weight="700" fill="#14213d">✅ ClickUp · DM · Pradeep, Ramu 🔒</text>
<circle cx="52" cy="104" r="16" fill="#b7791f"/><text x="52" y="109" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">P</text>
<rect x="78" y="86" width="350" height="56" rx="12" fill="#f3f5f9"/>
<text x="92" y="108" font-size="13" fill="#14213d">Semantic search got slow after 500k</text><text x="92" y="128" font-size="13" fill="#14213d">documents. What should I check?</text>
<circle cx="428" cy="186" r="16" fill="#0f9d8f"/><text x="428" y="191" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">R</text>
<rect x="52" y="160" width="350" height="76" rx="12" fill="#e2f5f1" stroke="#0f9d8f" stroke-width="2"/>
<text x="66" y="183" font-size="13" fill="#14213d">Add an HNSW index on the embedding</text><text x="66" y="203" font-size="13" fill="#14213d">column, run ANALYZE, cap ef_search</text><text x="66" y="223" font-size="13" fill="#14213d">at 64. Drops to ~20ms.</text>
<text x="66" y="262" font-size="12" fill="#5b6b85">Read with Ramu's key 🔑</text>
<!-- arrow -->
<path d="M462 198 C520 198 530 165 588 165" stroke="#2f6fed" stroke-width="2.5" fill="none" marker-end="url(#arr3)"/>
<text x="525" y="150" font-size="12" font-weight="700" fill="#2f6fed" text-anchor="middle">MAP</text>
<!-- record -->
<rect x="592" y="20" width="588" height="290" rx="16" fill="#fff" stroke="#dfe6f0" stroke-width="1.5"/>
<text x="612" y="50" font-size="13" font-weight="700" fill="#5b6b85" letter-spacing="1">STORED RECORD</text>
<g font-size="14">
  <rect x="612" y="64" width="548" height="30" rx="7" fill="#e2f5f1"/><text x="624" y="84" fill="#0f9d8f" font-weight="700">👤 Sender</text><text x="780" y="84" fill="#14213d" font-weight="700">Ramu</text>
  <rect x="612" y="98" width="548" height="30" rx="7" fill="#eef3fd"/><text x="624" y="118" fill="#2f6fed" font-weight="700">👥 Recipients</text><text x="780" y="118" fill="#14213d" font-weight="700">Pradeep</text>
  <rect x="612" y="132" width="548" height="30" rx="7" fill="#fcf0dc"/><text x="624" y="152" fill="#b7791f" font-weight="700">@ Mentions</text><text x="780" y="152" fill="#5b6b85">none</text>
  <rect x="612" y="166" width="548" height="30" rx="7" fill="#f3f5f9"/><text x="624" y="186" fill="#14213d">📍 Where</text><text x="780" y="186" fill="#14213d">ClickUp · DM: Pradeep, Ramu</text>
  <rect x="612" y="200" width="548" height="30" rx="7" fill="#f3f5f9"/><text x="624" y="220" fill="#14213d">🕒 When</text><text x="780" y="220" fill="#14213d">exact date &amp; time</text>
  <rect x="612" y="234" width="548" height="30" rx="7" fill="#f3f5f9"/><text x="624" y="254" fill="#14213d">📝 Text</text><text x="780" y="254" fill="#14213d">“Add an HNSW index on the embedding…”</text>
  <rect x="612" y="268" width="548" height="30" rx="7" fill="#f3f5f9"/><text x="624" y="288" fill="#14213d">🔗 Link</text><text x="780" y="288" fill="#2f6fed">open the original in ClickUp ↗</text>
</g>
</g><g transform="translate(44,360)" font-size="13"><rect width="54" height="22" rx="6" fill="#e2f5f1"/><text x="27" y="15" text-anchor="middle" font-weight="700" fill="#0f9d8f">SENT</text><text x="64" y="15" fill="#5b6b85">in Ramu's view</text><rect x="190" width="84" height="22" rx="6" fill="#eef3fd"/><text x="232" y="15" text-anchor="middle" font-weight="700" fill="#2f6fed">RECEIVED</text><text x="284" y="15" fill="#5b6b85">in Pradeep's view</text><rect x="430" width="92" height="22" rx="6" fill="#fcf0dc"/><text x="476" y="15" text-anchor="middle" font-weight="700" fill="#b7791f">MENTIONED</text><text x="532" y="15" fill="#5b6b85">when someone is @tagged</text></g>
</svg>
